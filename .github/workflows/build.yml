name: AntiGrav-3D-APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Signierschlüssel: der öffentliche Standard-Testschlüssel aus dem bisherigen Image (4.3), damit sich die
  # Signatur der App nicht ändert und Updates sich weiter einfach drüberinstallieren lassen (Einstellungen bleiben).
  key:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - run: mkdir -p k && cp /root/debug.keystore k/
      - uses: actions/upload-artifact@v4
        with:
          name: signkey
          path: k/debug.keystore
          retention-days: 1

  build:
    needs: key
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: signkey
          path: /tmp/sign

      - name: Godot einrichten (Vorlagen, Android-SDK)
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config
          cp -r /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/ || true
          cp -r /root/.config/godot ~/.config/ || true
          ls ~/.local/share/godot/export_templates/

      - name: Dateien importieren
        run: godot --headless --path . --import || godot --headless --path . --editor --quit || true

      - name: Startprüfung (Skriptfehler = kein Build)
        run: |
          godot --headless --path . --quit-after 30 > /tmp/run.log 2>&1 || true
          if grep -E "Parse Error|Failed to load script|SCRIPT ERROR" /tmp/run.log; then exit 1; fi

      - name: Versionsnummer
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"1.${{ github.run_number }}\"/" export_presets.cfg

      - name: Android-Bauvorlage und Video-Baustein
        shell: bash
        run: |
          mkdir -p build
          exec > >(tee build/template.log) 2>&1
          rm -rf android && mkdir -p android/build
          ls ~/.local/share/godot/export_templates/4.7.2.stable/
          unzip -q ~/.local/share/godot/export_templates/4.7.2.stable/android_source.zip -d android/build
          echo "4.7.2.stable" > android/.build_version
          touch android/build/.gdignore
          ls android/build
          grep -n "srcDirs\|java.srcDir" android/build/build.gradle || true
          mkdir -p android/build/src/com/antigrav
          cp android_src/com/antigrav/VideoExport.java android/build/src/com/antigrav/
          sed -i 's#</application>#    <meta-data android:name="org.godotengine.plugin.v2.VideoExport" android:value="com.antigrav.VideoExport"/>\n    </application>#' android/build/AndroidManifest.xml
          grep -n "VideoExport" android/build/AndroidManifest.xml

      - name: APK bauen
        # signiert mit dem öffentlichen Standard-Testschlüssel (kein Geheimnis), immer derselbe – siehe Schritt „key“
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/sign/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          godot --headless --verbose --path . --export-release "Android" build/AntiGrav3D-${{ github.run_number }}.apk > build/export.log 2>&1 || true
          tail -150 build/export.log
          test -f build/AntiGrav3D-${{ github.run_number }}.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AntiGrav 3D ${{ github.run_number }}
          files: build/AntiGrav3D-${{ github.run_number }}.apk
          make_latest: true

      - name: Protokoll bei Fehler hochladen
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log-${{ github.run_number }}
          name: CI log ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            build/*.log
