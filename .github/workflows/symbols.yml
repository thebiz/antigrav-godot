name: Absturz-Adressen auflösen

# Einmalige Hilfe: lädt die offiziellen Godot-Debug-Symbole und übersetzt die Adressen aus dem Absturz-Protokoll in Funktionsnamen
on:
  push:
    paths:
      - ".github/workflows/symbols.yml"
  workflow_dispatch:

jobs:
  sym:
    runs-on: ubuntu-latest
    steps:
      - name: Symbole suchen und Adressen auflösen
        shell: bash
        run: |
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu llvm > /dev/null || true
          mkdir -p s && cd s
          for tag in 4.7.2-stable; do
            curl -sL "https://api.github.com/repos/godotengine/godot-builds/releases/tags/$tag" > rel.json
            echo "== Dateien in $tag:"; python3 -c "import json;[print(a['name'],a['size']) for a in json.load(open('rel.json'))['assets']]"
            for u in $(python3 -c "import json;[print(a['browser_download_url']) for a in json.load(open('rel.json'))['assets'] if 'symbol' in a['name'].lower() and 'android' in a['name'].lower() or 'native_debug' in a['name'].lower()]"); do
              echo "lade $u"; curl -sL -o "$(basename $u)" "$u"
            done
          done
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z" -d "x_${z%.zip}"; done
          for z in *.tar.xz; do [ -f "$z" ] && mkdir -p x_t && tar -xf "$z" -C x_t; done
          find . -name "*.so*" -o -name "*.debug" | head -50
          ADDR="0x3f8b23c 0x3f8b3e8 0x15a5da8 0x3fad134 0x3c3d7e8 0x15a6884 0x2389e30 0x2916540 0x3fad71c 0x23bfaa0 0x23be61c 0x23bf02c 0x125a4a4 0x11fc954 0x1212ae0"
          for f in $(find . -type f \( -name "libgodot_android*.so*" -o -name "*.debug" \)); do
            echo "== $f"; file "$f"
            readelf -n "$f" 2>/dev/null | grep -i "build id" || true
            if readelf -n "$f" 2>/dev/null | grep -qi 270121fef88100c19643517c328b5868e01d345c; then echo "*** passende BuildId ***"; fi
            for a in $ADDR; do
              echo "--- $a"; (llvm-symbolizer --obj="$f" --inlining --demangle "$a" 2>/dev/null || aarch64-linux-gnu-addr2line -Cfipe "$f" "$a") | head -8
            done
          done
